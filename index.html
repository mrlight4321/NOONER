      padding: 0;
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

      background: radial-gradient(circle at top, #1e1b4b, #090d16);

      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      overflow-x: hidden;
    }

    .game-container {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 26px;
      width: 100%;
      max-width: 430px;
      padding: 22px 18px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      position: relative;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .header-title {
      font-size: 26px;
      font-weight: 900;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .sound-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .confidence-wrapper {
      width: 100%;
      background: #0f172a;
      height: 8px;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 15px;
      border: 1px solid #334155;
    }

    .confidence-bar {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, #38bdf8, #10b981);
      transition: width 0.4s ease;
      border-radius: 10px;
    }

    .avatar-wrapper {
      position: relative;
      width: 115px;
      height: 115px;
      margin: 0 auto 12px;
    }

    .nooner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #38bdf8;
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.5);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }

    .progress-text {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .speech-bubble {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 18px 15px;
      margin-bottom: 18px;
      min-height: 105px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.5;
      color: #f8fafc;
      transition: all 0.25s ease;

      color: #cbd5e1;
      margin-top: 8px;
      background: rgba(255, 255, 255, 0.06);

      border-radius: 20px;

    let soundEnabled = true;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(freq, type, duration) {
      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playClick(isYes) {
      if (navigator.vibrate) navigator.vibrate(25);

      { name: "تركيا", flag: "🇹🇷", quote: "« Merhaba ve Çay saati! »", fact: "العاصمة: أنقرة • تربط بين قارتي آسيا وأوروبا", arab: false, africa: false, asia: true, europe: true, americas: false, gulf: false, northAfrica: false, levant: false, nile: false, island: false, english: false, spanish: false, monarchy: false, redSea: false, hugeArea: false, europeanUnion: false },
      { name: "اليابان", flag: "🇯🇵", quote: "« Ganbatte kudasai! (استمر بقوة) »", fact: "العاصمة: طوكيو • كوكب التكنولوجيا والأنمي", arab: false, africa: false, asia: true, europe: false, americas: false, gulf: false, northAfrica: false, levant: false, nile: false, island: true, english: false, spanish: false, monarchy: true, redSea: false, hugeArea: false, europeanUnion: false },
      { name: "الصين", flag: "🇨🇳", quote: "« 加油 (Jiayou) - القوة والنجاح! »", fact: "العاصمة: بكين • موطن سور الصين العظيم", arab: false, africa: false, asia: true, europe: false, americas: false, gulf: false, northAfrica: false, levant: false, nile: false, island: false, english: false, spanish: false, monarchy: false, redSea: false, hugeArea: true, europeanUnion: false },

      { name: "كوريا الجنوبية", flag: "🇰🇷", quote: "« Fighting! (화이팅) »", fact: "العاصمة: سول • عاصمة التكنولوجيا الحديثة", arab: false, africa: false, asia: true, europe: false, americas: false, gulf: false, northAfrica: false, levant: false, nile: false, island: false, english: false, spanish: false, monarchy: false, redSea: false, hugeArea: false, europeanUnion: false },
      { name: "أستراليا", flag: "🇦🇺", quote: "« G'day mate! No worries! »", fact: "العاصمة: كانبرا • قارة ودولة في نفس الوقت", arab: false, africa: false, asia: false, europe: false, americas: false, gulf: false, northAfrica: false, levant: false, nile: false, island: true, english: true, spanish: false, monarchy: true, redSea: false, hugeArea: true, europeanUnion: false }
    ];

    let possibleCountries = [...countries];
    let askedKeys = [];
    let currentQuestion = null;
    let questionCount = 0;
    let lastGuessedCountry = null;

    function updateConfidence() {
      const total = countries.length;
      const remaining = possibleCountries.length;
      const percentage = Math.max(10, Math.round(((total - remaining + 1) / total) * 100));
      document.getElementById('confidence-bar').style.width = percentage + '%';
    }

    function getBestQuestion() {
      let bestQ = null;
      let bestDiff = Infinity;

      for (let q of questions) {
        if (askedKeys.includes(q.key)) continue;

        let yesCount = possibleCountries.filter(c => c[q.key] === true).length;
        let noCount = possibleCountries.filter(c => c[q.key] === false).length;

        if (yesCount === 0 || noCount === 0) continue;

        let diff = Math.abs(yesCount - noCount);
        if (diff < bestDiff) {
          bestDiff = diff;
          bestQ = q;
        }
      }
      return bestQ;
    }

    function nextTurn() {
      updateConfidence();

      if (possibleCountries.length === 1) {
        showGuess(possibleCountries[0]);
        return;
      }

      currentQuestion = getBestQuestion();

      if (!currentQuestion || possibleCountries.length === 0) {
        if (possibleCountries.length > 0) {
          showGuess(possibleCountries[0]);
        } else {
          showFailure();
        }
        return;
      }

      questionCount++;
      askedKeys.push(currentQuestion.key);
      document.getElementById('question-counter').innerText = `السؤال رقم ${questionCount}`;
      document.getElementById('dialogue-box').innerHTML = currentQuestion.text;
    }

    function handleAnswer(answer) {
      playClick(answer);
      if (answer !== null && currentQuestion) {
        possibleCountries = possibleCountries.filter(c => c[currentQuestion.key] === answer);
      }
      nextTurn();
    }

    function showGuess(country) {
      lastGuessedCountry = country;
      document.getElementById('confidence-bar').style.width = '100%';
      document.getElementById('question-counter').innerText = `Nooner عرفها في ${questionCount} أسئلة!`;
      document.getElementById('dialogue-box').innerHTML = `
        <div>
          أنت من <strong>${country.name}</strong>!
          <span class="result-flag">${country.flag}</span>
          <div class="quote-box">${country.quote}</div>
          <div class="fact-badge">${country.fact}</div>
        </div>
      `;
      document.getElementById('controls').innerHTML = `
        <button class="btn btn-yes" onclick="celebrate()">صح 100%! 🎉</button>
        <button class="btn btn-no" onclick="showFailure()">لأ غلط 😅</button>
      `;
    }

    function celebrate() {
      playWin();
      document.getElementById('dialogue-box').innerHTML = `
        طبعاً Nooner ما بيغلطش! 😎<br>
        <span style="font-size: 14px; color: #94a3b8; margin-top: 6px; display:block;">تحدى صحابك وشوف Nooner هيعرف بلدهم ولا لأ!</span>
      `;
      document.getElementById('controls').innerHTML = `
        <button class="btn btn-share" onclick="shareResult()">مشاركة النتيجة على واتساب 📲</button>
        <button class="btn btn-restart" onclick="restartGame()">العب مرة تانية 🔄</button>
      `;
    }

    function shareResult() {
      const gameLink = "https://mrlight4321.github.io/NOONER/";
      const text = `المارد الذكي Nooner عرف إنني من ${lastGuessedCountry.name} ${lastGuessedCountry.flag} في ${questionCount} أسئلة بس! 🔥\nتحداه دلوقتي من هنا 👇\n${gameLink}`;
      const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    }

    function showFailure() {
      playClick(false);
      document.getElementById('question-counter').innerText = "يا إلهي!";
      document.getElementById('dialogue-box').innerText = "واضح إن بلدك نادرة جداً أو اللفة حيرتني! نلعب تاني ونعوضها؟ 🤔";
      document.getElementById('controls').innerHTML = `
        <button class="btn btn-restart" onclick="restartGame()">العب مرة تانية 🔄</button>
      `;
    }

    function restartGame() {
      playClick(true);
      possibleCountries = [...countries];
      askedKeys = [];
      currentQuestion = null;
      questionCount = 0;
      document.getElementById('controls').innerHTML = `
        <button class="btn btn-yes" onclick="handleAnswer(true)">أيوه</button>
        <button class="btn btn-no" onclick="handleAnswer(false)">لأ</button>
        <button class="btn btn-unknown" onclick="handleAnswer(null)">مش متأكد</button>
      `;
      nextTurn();
    }

    nextTurn();
  </script>
